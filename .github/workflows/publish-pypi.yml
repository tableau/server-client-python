name: Publish to PyPi

# Builds the package, checks wheel structure, publishes to TestPyPI, runs smoke
# tests against TestPyPI, then publishes to real PyPI only if all prior steps pass.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build and check wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build dist files
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test] build
          python -m build
          git describe --tag --dirty --always
      - name: Check wheel structure
        run: python -m pytest test/test_packaging.py -m packaging -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-test-pypi:
    name: Publish to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3, license BSD-2
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test-pypi:
    name: Smoke test from Test PyPI
    needs: publish-test-pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from Test PyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ --no-deps tableauserverclient
          pip install tableauserverclient
      - name: Smoke test
        run: |
          python -c "import tableauserverclient as TSC; server = TSC.Server('http://example.com', use_server_version=False)"

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-test-pypi
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3, license BSD-2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
